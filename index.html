 <!DOCTYPE html>
 <html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <title>Web Development Assignment</title>
 
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
 
   <style>
     * {
       margin: 0;
       padding: 0;
       box-sizing: border-box;
     }
 
     body {
       font-family: 'Poppins', sans-serif;
       min-height: 100vh;
       background: linear-gradient(135deg, #5b247a, #1bcedf);
       display: flex;
       justify-content: center;
       align-items: center;
       overflow: hidden;
       position: relative;
       flex-direction: column;
       text-align: center;
     }
 
     .animated-bg span {
       position: absolute;
       display: block;
       background: rgba(255,255,255,0.1);
       border-radius: 50%;
       animation: float 15s infinite ease-in-out, pulse 6s infinite ease-in-out;
       z-index: 0;
     }
 
     .animated-bg span:nth-child(1) {
       width: 100px;
       height: 100px;
       top: 10%;
       left: 5%;
       animation-delay: 0s;
     }
 
     .animated-bg span:nth-child(2) {
       width: 70px;
       height: 70px;
       bottom: 15%;
       right: 10%;
       animation-delay: 3s;
     }
 
     .animated-bg span:nth-child(3) {
       width: 120px;
       height: 120px;
       top: 50%;
       left: 60%;
       animation-delay: 6s;
     }
 
     @keyframes float {
       0%, 100% { transform: translateY(0); }
       50% { transform: translateY(-20px); }
     }
 
     @keyframes pulse {
       0%, 100% { transform: scale(1); opacity: 0.2; }
       50% { transform: scale(1.2); opacity: 0.4; }
     }
 
     .container {
       display: flex;
       gap: 25px;
       width: 90%;
       max-width: 1200px;
       padding: 30px;
       border-radius: 25px;
       background: rgba(255, 255, 255, 0.1);
       backdrop-filter: blur(20px);
       box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
       position: relative;
       z-index: 1;
       animation: fadeIn 1.5s ease-in-out;
     }
 
     @keyframes fadeIn {
       from { opacity: 0; transform: scale(0.95); }
       to { opacity: 1; transform: scale(1); }
     }
 
     .frame {
       flex: 1;
       position: relative;
       padding: 25px;
       border-radius: 20px;
       background: rgba(255, 255, 255, 0.15);
       backdrop-filter: blur(10px);
       transition: all 0.4s ease;
       border: 2px solid transparent;
       background-clip: padding-box;
       animation: bobbing 6s infinite ease-in-out;
       cursor: pointer;
     }

     .frame:hover {
       transform: scale(1.03) translateY(-10px);
       box-shadow: 0 12px 35px rgba(255, 255, 255, 0.3);
     }
 
     .frame::before {
       content: '';
       position: absolute;
       top: 0; left: 0;
       width: 100%;
       height: 100%;
       border-radius: 20px;
       padding: 2px;
       background: linear-gradient(45deg, #ff00ff, #00ffff);
       -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
       -webkit-mask-composite: xor;
       mask-composite: exclude;
       z-index: -1;
     }
 
     @keyframes bobbing {
       0%, 100% { transform: translateY(0); }
       50% { transform: translateY(-5px); }
     }
 
     .frame h2 {
       background: linear-gradient(90deg, #ffccff, #ccffff);
       -webkit-background-clip: text;
       background-clip: text;
       background-clip: text;
       background-clip: text;
       background-clip: text;
       background-clip: text;
       background-clip: text;
       -webkit-text-fill-color: transparent;
       font-size: 28px;
       font-weight: 600;
       margin-bottom: 15px;
       animation: textFade 2s ease forwards;
     }
 
     .frame p {
       color: #ffffff;
       font-size: 16px;
       line-height: 1.6;
       opacity: 0;
       animation: textFade 2s ease 0.5s forwards;
     }
 
     @keyframes textFade {
       from { opacity: 0; transform: translateY(10px); }
       to { opacity: 1; transform: translateY(0); }
     }
 
     @media (max-width: 768px) {
       .container {
         flex-direction: column;
         padding: 20px;
       }
 
       .frame {
         width: 100%;
       }
     }
 
     .intro {
       text-align: center;
       margin-bottom: 30px;
       animation: fadeInText 2s ease-in-out;
     }
 
     .intro h1 {
       font-size: 48px;
       color: #ffffff;
       background: linear-gradient(90deg, #ffccff, #ccffff);
       -webkit-background-clip: text;
       -webkit-text-fill-color: transparent;
       font-weight: 700;
       margin-bottom: 15px;
       text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
       animation: textPop 2s ease-out;
     }
 
     .intro p {
       font-size: 20px;
       color: #ffffff;
       margin: 0;
       text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
       opacity: 0;
       animation: fadeInText 2s ease-in-out 0.5s forwards;
     }
 
     @keyframes textPop {
       from {
         transform: scale(0.95);
         opacity: 0;
       }
       to {
         transform: scale(1);
         opacity: 1;
       }
     }
 
     @keyframes fadeInText {
       from {
         opacity: 0;
         transform: translateY(10px);
       }
       to {
         opacity: 1;
         transform: translateY(0);
       }
     }
   </style>
 </head>
 <body>
   <div class="animated-bg">
     <span></span>
     <span></span>
     <span></span>
   </div>
 
   <div class="intro">
     <h1>Web Development Assignment</h1>
     <p>Name: <strong>Divya Sonawane</strong></p>
     <p>Roll No: <strong>85</strong></p>
   </div>
 
   <div class="container">
     <div class="frame" onclick="window.location.href='html.html'">
       <h2>HTML AND CSS ASSIGNMENTS</h2>
       <p>Click to view assignments.</p>
     </div>

   </div>
 </body>
 </html>
