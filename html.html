<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Assignments</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #5b247a, #1bcedf);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      overflow: auto; /* Allow scrolling */
      text-align: center;
    }

    /* For Firefox */
    html {
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }

    /* Hide scrollbar for WebKit browsers (Chrome, Safari, etc.) */
    body::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    body::-webkit-scrollbar-thumb {
      background: transparent;
    }

    .animated-bg span {
      position: absolute;
      display: block;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out, pulse 6s infinite ease-in-out;
      z-index: 0;
    }

    .animated-bg span:nth-child(1) {
      width: 100px;
      height: 100px;
      top: 10%;
      left: 5%;
      animation-delay: 0s;
    }

    .animated-bg span:nth-child(2) {
      width: 70px;
      height: 70px;
      bottom: 15%;
      right: 10%;
      animation-delay: 3s;
    }

    .animated-bg span:nth-child(3) {
      width: 120px;
      height: 120px;
      top: 50%;
      left: 60%;
      animation-delay: 6s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.2); opacity: 0.4; }
    }

    .frame {
      width: 80%;
      max-width: 500px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
      animation: fadeIn 1.5s ease-in-out;
    }

    .frame + .frame {
      margin-top: 35px; /* Add spacing between frames */
    }

    .frame::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(45deg, #ff00ff, #00ffff);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      background: linear-gradient(90deg, #ffccff, #ccffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .assignment-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .assignment-card {
      display: block; /* Make the <a> tag a block element */
      padding: 12px 95px;
      border-radius: 12px;
      position: relative;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      transition: transform 0.3s ease;
      z-index: 1;
      text-align: center; /* Center the text */
      text-decoration: none; /* Remove underline from links */
    }

    .assignment-card:hover {
      transform: scale(1.05);
    }

    .assignment-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(45deg, #ff00ff, #00ffff);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
    }

    .assignment-card div {
      color: white;
      font-weight: 500;
      font-size: 18px;
      position: relative;
    }
  </style>
</head>
