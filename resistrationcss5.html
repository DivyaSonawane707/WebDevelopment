<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #1f4037, #99f2c8);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-container {
      display: flex;
      width: 900px;
      max-width: 95%;
      height: 550px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .left-panel {
      flex: 1;
      background: url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=934&q=80') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      color: white;
    }

    .left-panel h2 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .left-panel p {
      font-size: 16px;
      font-weight: 300;
    }

    .form-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.25);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-panel h2 {
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      color: #333;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    label {
      font-size: 15px;
      color: #333;
    }

    input {
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.8);
      color: #333;
      transition: 0.3s ease;
    }

    input:focus {
      outline: none;
      border: 2px solid #1f4037;
      box-shadow: 0 0 10px rgba(31, 64, 55, 0.3);
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #00c9ff, #92fe9d);
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 201, 255, 0.4);
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        height: auto;
      }
      .left-panel {
        height: 200px;
        text-align: center;
      }
      .form-panel {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="left-panel">
      <h2>Welcome to Our Community</h2>
      <p>Join us today and unlock amazing opportunities tailored just for you.</p>
    </div>
    <div class="form-panel">
      <h2>Register Now</h2>
      <form>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
        <button type="submit">Sign Up</button>
      </form>
    </div>
  </div>
</body>
</html>
