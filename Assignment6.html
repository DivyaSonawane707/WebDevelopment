<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories: Flowers, Fruits, Birds</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            padding: 40px 20px;
            text-align: center;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .category-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
            margin-top: 20px;
        }

        .category-container iframe {
            width: 100%;
            max-width: 420px;
            height: 500px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
            background-color: white;
        }

        .category-container iframe:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            filter: brightness(1.1);
        }

        @media (max-width: 768px) {
            .category-container {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            .category-container iframe {
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .category-container iframe {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <h1>🌸🍉🕊️ Explore the Categories</h1>
    
    <div class="category-container">
        <iframe src="https://www.flowermeaning.com" title="Flowers"></iframe>
        <iframe src="https://www.fruitsinfo.com" title="Fruits"></iframe>
        <iframe src="https://kids.nationalgeographic.com/nature" title="Birds"></iframe>
    </div>

</body>
</html>
